[package]
name = "vocalkeep-desktop"
description = "Vocalkeep: a calm recording studio for banking your own voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "vocalkeep-desktop"

[lib]
name = "vocalkeep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
vocalkeep-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
cpal.workspace = true
dirs.workspace = true
uuid.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"

[dev-dependencies]
tempfile.workspace = true
